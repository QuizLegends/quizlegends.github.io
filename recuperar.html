<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação - Quiz Legends</title>
    <style>
        :root {
            --ouro: #c89b3c;
            --fundo-profundo: #010a13;
            --card-azul: #091428;
            --erro: #ff4e50;
            --sucesso: #28a745;
            --ouro-brilhante: #f0e6d2;
        }

        body { 
            background: url('admin-vertical.png') no-repeat center center fixed; 
            background-size: cover;
            color: white; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            overflow: hidden;
        }

        /* BOX PRINCIPAL */
        .login-box { 
            border: 3px solid var(--ouro); 
            padding: 40px 35px; 
            background: linear-gradient(135deg, rgba(9, 20, 40, 0.98) 0%, rgba(1, 10, 19, 1) 100%); 
            border-radius: 4px; 
            width: 330px; 
            text-align: center; 
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .login-title { 
            color: var(--ouro); 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-bottom: 25px; 
            font-weight: bold; 
            display: block; 
        }

        input { 
            width: 100%; 
            padding: 14px 15px; 
            border: 2px solid var(--ouro); 
            background: rgba(5, 10, 20, 0.9); 
            color: var(--ouro-brilhante); 
            box-sizing: border-box; 
            font-size: 16px; 
            outline: none; 
            margin-bottom: 15px;
        }

        input::placeholder {
            color: rgba(200, 155, 60, 0.5);
        }

        /* BOTÃO DOURADO */
        button { 
            background: var(--ouro); 
            color: #010a13; 
            padding: 16px; 
            width: 100%; 
            border: 1px solid #785a28; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase;
            transition: 0.3s;
        }

        button:hover {
            background: #e1b34a;
            filter: brightness(1.2);
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
            border-color: #333;
        }

        .step-2 { display: none; } 

        #msg { 
            margin-top: 15px; 
            font-size: 12px; 
            color: var(--erro); 
            font-weight: bold; 
            text-transform: uppercase; 
        }

        /* MODAL COM FUNDO AZUL E BORDAS DOURADAS */
        #modal-alerta { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.85); 
            z-index: 10000; 
            align-items: center; 
            justify-content: center; 
            backdrop-filter: blur(4px);
        }

        .modal-content { 
            background: var(--card-azul); 
            border: 2px solid var(--ouro); 
            padding: 30px; 
            border-radius: 4px; 
            text-align: center; 
            width: 85%; 
            max-width: 300px; 
            box-shadow: 0 0 25px rgba(200, 155, 60, 0.2);
        }

        .modal-content h3 {
            color: var(--ouro);
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-content p {
            color: var(--ouro-brilhante);
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div id="modal-alerta">
        <div class="modal-content">
            <h3 id="modal-titulo">AVISO</h3>
            <p id="modal-msg"></p>
            <button id="btnAcaoModal">ENTENDIDO</button>
        </div>
    </div>

    <div class="login-box">
        <label class="login-title">Recuperar Acesso</label>
        
        <div id="step1">
            <p style="font-size: 13px; color: #ccc; margin-bottom: 20px;">Digite o e-mail cadastrado para receber o link de redefinição.</p>
            <input type="email" id="emailBusca" placeholder="SEU E-MAIL">
            <button id="btnVerificar">Enviar Link</button>
        </div>

        <div id="step2" class="step-2">
            <p style="font-size: 13px; color: #ccc;">Pergaminho enviado!</p>
            <p id="usuarioEncontrado" style="color: var(--ouro); font-weight: bold; font-size: 16px; margin-bottom: 20px; word-break: break-all;"></p>
            <p style="font-size: 12px; color: #fff; margin-bottom: 20px;">Verifique sua caixa de entrada e spam.</p>
            <button onclick="window.location.href='index.html'">Voltar ao Login</button>
        </div>
        
        <div id="msg"></div>
        <a href="index.html" style="color: var(--ouro); text-decoration: none; font-size: 12px; display: block; margin-top: 25px; font-weight: bold; letter-spacing: 1px;">CANCELAR</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4dm0KoyJswhyCY7tgbF4D2nmuZl84X8E",
            authDomain: "quizlegends-f58fc.firebaseapp.com",
            projectId: "quizlegends-f58fc",
            storageBucket: "quizlegends-f58fc.firebasestorage.app",
            messagingSenderId: "1050463164018",
            appId: "1:1050463164018:web:91de002b8afc8e678f54eb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Função de Alerta com o Modal Estilizado
        function alerta(titulo, texto, corTitulo) {
            const modal = document.getElementById('modal-alerta');
            const tituloEl = document.getElementById('modal-titulo');
            const msgEl = document.getElementById('modal-msg');
            
            tituloEl.innerText = titulo;
            tituloEl.style.color = corTitulo || "#c89b3c";
            msgEl.innerText = texto;
            
            modal.style.display = 'flex';
            
            document.getElementById('btnAcaoModal').onclick = () => {
                modal.style.display = 'none';
            };
        }

        // --- ENVIAR E-MAIL DE RECUPERAÇÃO ---
        document.getElementById('btnVerificar').onclick = async () => {
            const email = document.getElementById('emailBusca').value.trim();
            const btn = document.getElementById('btnVerificar');
            const msg = document.getElementById('msg');

            if(!email) { 
                msg.innerText = "DIGITE O SEU E-MAIL!"; 
                return; 
            }
            
            btn.disabled = true; 
            btn.innerText = "ENVIANDO...";
            msg.innerText = "";

            try {
                // Envio do link de redefinição via Firebase
                await sendPasswordResetEmail(auth, email);

                // Sucesso: Transição de interface
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
                document.getElementById('usuarioEncontrado').innerText = email;
                
            } catch (e) {
                btn.disabled = false; 
                btn.innerText = "Enviar Link";
                
                console.error("Erro Firebase:", e.code);

                if (e.code === 'auth/user-not-found') {
                    alerta("ERRO", "Nenhum invocador encontrado com este e-mail.", "#ff4e50");
                } else if (e.code === 'auth/invalid-email') {
                    msg.innerText = "FORMATO DE E-MAIL INVÁLIDO!";
                } else if (e.code === 'auth/too-many-requests') {
                    alerta("AVISO", "Muitas tentativas. Tente novamente mais tarde.", "#ff4e50");
                } else {
                    alerta("FALHA", "Erro ao conectar ao servidor de Runeterra.", "#ff4e50");
                }
            }
        };
    </script>
</body>
</html>
